<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Menú - Restaurante</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Nuestro Menú</h1>
            <a href="index.html" class="btn-volver">← Volver</a>
        </header>

        <div class="filtros">
            <button class="btn-filtro active" data-categoria="todos">Todos</button>
            <button class="btn-filtro" data-categoria="Entradas">Entradas</button>
            <button class="btn-filtro" data-categoria="Plato fuerte">Platos Fuertes</button>
            <button class="btn-filtro" data-categoria="Bebidas">Bebidas</button>
            <button class="btn-filtro" data-categoria="Postres">Postres</button>
        </div>

        <div id="menu-container" class="menu-grid">
            <div class="loading">Cargando menú...</div>
        </div>

        <footer>
            <p>© 2024 Restaurante "Tu Sabor"</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hacer Pedido - Restaurante</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Hacer Pedido</h1>
            <a href="index.html" class="btn-volver">← Volver</a>
        </header>

        <div class="form-pedido">
            <h2>Datos del Cliente</h2>
            <form id="form-cliente">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="tel" id="telefono" placeholder="Teléfono" required>
                <input type="text" id="direccion" placeholder="Dirección de entrega" required>
            </form>

            <h2>Selecciona tus platillos</h2>
            <div id="menu-selector" class="menu-selector">
                <div class="loading">Cargando menú...</div>
            </div>

            <div id="carrito" class="carrito">
                <h3>Tu Pedido</h3>
                <div id="carrito-items"></div>
                <div class="carrito-total">
                    <strong>Total: $<span id="total">0</span></strong>
                </div>
            </div>

            <div class="metodo-pago">
                <h3>Método de Pago</h3>
                <select id="metodo-pago">
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="transferencia">Transferencia</option>
                </select>
            </div>

            <button id="btn-finalizar" class="btn-finalizar">Finalizar Pedido</button>
            <div id="mensaje" class="mensaje"></div>
        </div>

        <footer>
            <p>© 2024 Restaurante "Tu Sabor"</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
